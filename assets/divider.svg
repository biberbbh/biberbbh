<svg xmlns="http://www.w3.org/2000/svg" width="600" height="4" viewBox="0 0 600 4">
  <defs>
    <style>
      @keyframes shimmer { 0% { transform: translateX(-600px); } 100% { transform: translateX(600px); } }
      .shimmer { animation: shimmer 3s linear infinite; }
    </style>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="30%" stop-color="#ff00ff" />
      <stop offset="50%" stop-color="#00ffff" />
      <stop offset="70%" stop-color="#ff00ff" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>
  <rect width="600" height="4" fill="url(#g)" opacity="0.6" />
  <rect width="600" height="1" fill="url(#g)" class="shimmer" opacity="0.3" />
</svg>
